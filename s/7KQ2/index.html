<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFFFFF">
  <title>Sala de espera · Meet Aula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css">
  <style>
    body{background:#fff}.page{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.header,.main,.footer{width:min(1120px,calc(100% - 32px));margin-inline:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:22px 0}.state{font-size:.72rem;color:var(--ma-ink-soft)}.state select{margin-left:6px;border:1px solid var(--ma-line);border-radius:8px;background:#fff;padding:5px 8px}
    .main{display:grid;align-items:center;padding:28px 0 56px}.layout{display:grid;gap:28px}.preview{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:22px;background:linear-gradient(145deg,var(--ma-stage),var(--ma-stage-2));box-shadow:var(--ma-shadow-md)}.silhouette{position:absolute;left:50%;top:48%;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08);transform:translate(-50%,-50%)}.silhouette::after{content:"";position:absolute;left:50%;top:82px;width:170px;height:120px;border-radius:90px 90px 20px 20px;background:rgba(255,255,255,.06);transform:translateX(-50%)}.user-initial{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 clamp(2.5rem,14vw,5rem)/1 var(--ma-font-display);z-index:2}.preview-controls{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;z-index:3}.mini-off{display:grid;width:38px;height:38px;place-items:center;border-radius:50%;background:var(--ma-signal);color:#fff}.mini-off .ma-icon{width:18px;height:18px}
    .info{display:grid;align-content:center}.eyebrow{margin:0 0 9px;color:var(--ma-teal-dark);font-size:.75rem;font-weight:700}.info h1{margin:0;font:700 clamp(2.1rem,9vw,4rem)/.99 var(--ma-font-display);letter-spacing:-.03em}.subtitle{margin:12px 0 0;max-width:540px;color:var(--ma-ink-soft);font-size:1rem}.count{margin-top:26px}.count small{display:block;margin-bottom:5px;color:var(--ma-ink-soft);font-size:.78rem;font-weight:700}.count strong{font:700 clamp(3rem,16vw,5.5rem)/.9 var(--ma-font-display);font-variant-numeric:tabular-nums;letter-spacing:-.04em}.people{margin:14px 0 0;color:var(--ma-ink-soft)}.join{margin-top:22px;width:100%;min-height:54px}.sound{display:flex;align-items:center;justify-content:center;gap:7px;margin:10px 0 0;color:var(--ma-ink-soft);font-size:.82rem}.sound .ma-icon{width:16px;height:16px}.opened-copy{display:none;margin:14px 0 0;color:var(--ma-teal-dark);font-weight:700}
    body[data-demo-state="aberta"] .count small{color:var(--ma-teal-dark)}body[data-demo-state="aberta"] .opened-copy{display:block}body[data-demo-state="aberta"] .join{animation:oncePulse .75s ease-out 1}@keyframes oncePulse{0%{box-shadow:0 0 0 0 rgba(11,122,117,.35)}70%{box-shadow:0 0 0 10px rgba(11,122,117,0)}100%{box-shadow:0 0 0 0 rgba(11,122,117,0)}}
    .footer{border-top:1px solid var(--ma-line);padding:20px 0 28px;color:var(--ma-ink-soft);font-size:.78rem;text-align:center}
    @media(min-width:820px){.layout{grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:54px}.main{padding-top:18px}.join{width:auto;min-width:220px}.sound{justify-content:flex-start}.preview{aspect-ratio:16/9}}
    @media(prefers-reduced-motion:reduce){body[data-demo-state="aberta"] .join{animation:none}}
  </style>
</head>
<body data-demo-state="espera"><div class="page">
<header class="header"><a class="ma-brand" href="../../" aria-label="Meet Aula"><span class="ma-brand__mark" aria-hidden="true"></span><span>Meet Aula</span></a><label class="state">estado<select id="statePicker" aria-label="Estado da sala"><option value="espera">aguardando</option><option value="aberta">sala aberta</option></select></label></header>
<main class="main"><div class="layout">
  <section class="preview" aria-label="Prévia da sua câmera"><div class="silhouette" aria-hidden="true"></div><div class="user-initial">C</div><div class="preview-controls"><span class="mini-off" role="img" aria-label="Microfone desligado"><svg class="ma-icon" aria-hidden="true"><use href="../../icons.svg#mic-off"/></svg></span><span class="mini-off" role="img" aria-label="Câmera desligada"><svg class="ma-icon" aria-hidden="true"><use href="../../icons.svg#video-off"/></svg></span></div></section>
  <section class="info" aria-labelledby="titulo"><p class="eyebrow">Método VSP · com Isack Wesller</p><h1 id="titulo">Oferta-semente irresistível</h1><p class="subtitle">Como criar anúncios que atraem clientes para o seu negócio local.</p><div class="count" role="timer" aria-live="polite"><small id="countLabel">A sala abre em</small><strong id="countValue">08:12</strong></div><p class="people">12 pessoas já estão na sala.</p><button class="ma-btn ma-btn--primary join" type="button">Participar agora</button><p class="sound"><svg class="ma-icon" aria-hidden="true"><use href="../../icons.svg#volume-2"/></svg>Toque para liberar o som</p><p class="opened-copy">A sala abriu. Você já pode entrar.</p></section>
</div></main>
<footer class="footer">Meet Aula · Termos · Privacidade</footer>
</div>
<script>
(() => {
  const valid=new Set(['espera','aberta']);
  const p=new URLSearchParams(location.search);
  const picker=document.getElementById('statePicker');
  const label=document.getElementById('countLabel'); const value=document.getElementById('countValue');
  const set=v=>{document.body.dataset.demoState=v;picker.value=v;label.textContent=v==='aberta'?'Sala aberta':'A sala abre em';value.textContent=v==='aberta'?'00:00':'08:12';};
  const state=valid.has(p.get('estado'))?p.get('estado'):'espera'; set(state);
  picker.addEventListener('change',e=>{const u=new URL(location.href);u.searchParams.set('estado',e.target.value);history.replaceState({},'',u);set(e.target.value)});
})();
</script>
</body></html>
